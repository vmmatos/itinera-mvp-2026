name: itinera

# Load order: .dev.env first, .secrets.env overrides on conflict.
# Run: docker compose --env-file dev/.dev.env --env-file dev/.secrets.env ...
# Or use: make dev / make infra (Makefile handles flags)

services:

  ## ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: itinera-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - ../infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ## ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: itinera-redis-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ## ── RabbitMQ ─────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: itinera-rabbitmq-bus
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ../infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  ## ── Kong API Gateway ─────────────────────────────────────────────────────────
  kong-migrations:
    image: kong:3.6
    command: kong migrations bootstrap
    restart: on-failure
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: ${KONG_PG_HOST}
      KONG_PG_DATABASE: ${KONG_PG_DATABASE}
      KONG_PG_USER: ${KONG_PG_USER}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  kong:
    image: kong:3.6
    container_name: itinera-kong-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: ${KONG_PG_HOST}
      KONG_PG_DATABASE: ${KONG_PG_DATABASE}
      KONG_PG_USER: ${KONG_PG_USER}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: notice
      KONG_PLUGINS: bundled
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  ## ── Frontend ─────────────────────────────────────────────────────────────────
  web:
    image: node:22-alpine
    container_name: itinera-frontend
    working_dir: /app
    command: ["sh", "-c", "yarn install && yarn dev --host 0.0.0.0 --port 3000"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost}
      NUXT_PUBLIC_WS_URL: ${NUXT_PUBLIC_WS_URL:-ws://localhost}
      NUXT_PUBLIC_APP_MODE: ${NODE_ENV:-development}
    ports:
      - "24678:24678"  # Nuxt HMR websocket — app served via nginx:80, not this port
    volumes:
      - ../apps/frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-nuxt-build:/app/.nuxt
    depends_on:
      - kong

  ## ── Nginx Ingress ────────────────────────────────────────────────────────────
  ingress:
    image: nginx:1.27-alpine
    container_name: itinera-ingress
    restart: unless-stopped
    # Skip entrypoint init scripts — they fail when conf is read-only
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - kong
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ## ── Auth ─────────────────────────────────────────────────────────────────────
  auth:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    container_name: itinera-auth
    restart: unless-stopped
    profiles: [services]
    environment:
      PORT: ${AUTH_PORT:-3010}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_CONSUMER_KEY: ${JWT_CONSUMER_KEY:-itinera}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost/api/auth/oauth2/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "${AUTH_PORT:-3010}:${AUTH_PORT:-3010}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kong:
        condition: service_healthy
    volumes:
      - ../services/auth/src:/app/services/auth/src
      - ../services/shared/src:/app/services/shared/src

  ## ── Orchestrator ─────────────────────────────────────────────────────────────
  orchestrator:
    build:
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    container_name: itinera-orchestrator
    restart: unless-stopped
    profiles: [services]
    environment:
      PORT: ${ORCHESTRATOR_PORT}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
    ports:
      - "${ORCHESTRATOR_PORT:-3001}:${ORCHESTRATOR_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kong:
        condition: service_healthy
    volumes:
      - ../services/orchestrator/src:/app/services/orchestrator/src
      - ../services/shared/src:/app/services/shared/src

  ## ── Preference Agent ─────────────────────────────────────────────────────────
  preference-agent:
    build:
      context: ..
      dockerfile: services/preference-agent/Dockerfile
    container_name: itinera-preference-agent
    restart: unless-stopped
    profiles: [services]
    environment:
      PORT: ${PREFERENCE_AGENT_PORT}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
    ports:
      - "${PREFERENCE_AGENT_PORT:-3002}:${PREFERENCE_AGENT_PORT:-3002}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kong:
        condition: service_healthy
    volumes:
      - ../services/preference-agent/src:/app/services/preference-agent/src
      - ../services/shared/src:/app/services/shared/src

  ## ── Orchestrator Agent ───────────────────────────────────────────────────────
  orchestrator-agent:
    build:
      context: ..
      dockerfile: services/orchestrator-agent/Dockerfile
    container_name: itinera-orchestrator-agent
    restart: unless-stopped
    profiles: [services]
    environment:
      PORT: ${ORCHESTRATOR_AGENT_PORT}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
    ports:
      - "${ORCHESTRATOR_AGENT_PORT:-3003}:${ORCHESTRATOR_AGENT_PORT:-3003}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kong:
        condition: service_healthy
    volumes:
      - ../services/orchestrator-agent/src:/app/services/orchestrator-agent/src
      - ../services/shared/src:/app/services/shared/src

  ## ── Finance Agent ────────────────────────────────────────────────────────────
  finance-agent:
    build:
      context: ..
      dockerfile: services/finance-agent/Dockerfile
    container_name: itinera-finance-agent
    restart: unless-stopped
    profiles: [services]
    environment:
      PORT: ${FINANCE_AGENT_PORT}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
    ports:
      - "${FINANCE_AGENT_PORT:-3004}:${FINANCE_AGENT_PORT:-3004}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kong:
        condition: service_healthy
    volumes:
      - ../services/finance-agent/src:/app/services/finance-agent/src
      - ../services/shared/src:/app/services/shared/src

  ## ── Logistics Agent ──────────────────────────────────────────────────────────
  logistics-agent:
    build:
      context: ..
      dockerfile: services/logistics-agent/Dockerfile
    container_name: itinera-logistics-agent
    restart: unless-stopped
    profiles: [services]
    environment:
      PORT: ${LOGISTICS_AGENT_PORT}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-1800}
      ATTRACTIONS_CACHE_TTL_SECONDS: ${ATTRACTIONS_CACHE_TTL_SECONDS:-86400}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    ports:
      - "${LOGISTICS_AGENT_PORT:-3005}:${LOGISTICS_AGENT_PORT:-3005}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kong:
        condition: service_healthy
    volumes:
      - ../services/logistics-agent/src:/app/services/logistics-agent/src
      - ../services/shared/src:/app/services/shared/src

  ## ── Validator ────────────────────────────────────────────────────────────────
  validator:
    build:
      context: ..
      dockerfile: services/validator/Dockerfile
    container_name: itinera-validator
    restart: unless-stopped
    profiles: [services]
    environment:
      PORT: ${VALIDATOR_PORT:-3006}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
    ports:
      - "${VALIDATOR_PORT:-3006}:${VALIDATOR_PORT:-3006}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kong:
        condition: service_healthy
    volumes:
      - ../services/validator/src:/app/services/validator/src
      - ../services/shared/src:/app/services/shared/src

  ## ── Notification ─────────────────────────────────────────────────────────────
  notification:
    build:
      context: ..
      dockerfile: services/notification/Dockerfile
    container_name: itinera-notification
    restart: unless-stopped
    profiles: [services]
    environment:
      PORT: ${NOTIFICATION_PORT:-3007}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      SENDGRID_ENABLED: ${SENDGRID_ENABLED:-false}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-noreply@itinera.dev}
      NOTIFICATION_FROM_NAME: ${NOTIFICATION_FROM_NAME:-Itinera}
    ports:
      - "${NOTIFICATION_PORT:-3007}:${NOTIFICATION_PORT:-3007}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      kong:
        condition: service_healthy
    volumes:
      - ../services/notification/src:/app/services/notification/src
      - ../services/shared/src:/app/services/shared/src

  ## ── Sharing ──────────────────────────────────────────────────────────────────
  sharing:
    build:
      context: ..
      dockerfile: services/sharing/Dockerfile
    container_name: itinera-sharing
    restart: unless-stopped
    profiles: [services]
    environment:
      PORT: ${SHARING_PORT:-3008}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      SHARE_LINK_TTL_SECONDS: ${SHARE_LINK_TTL_SECONDS:-604800}
      SHARING_BASE_URL: ${SHARING_BASE_URL:-http://localhost:8000/api/share}
    ports:
      - "${SHARING_PORT:-3008}:${SHARING_PORT:-3008}"
    depends_on:
      redis:
        condition: service_healthy
      kong:
        condition: service_healthy
    volumes:
      - ../services/sharing/src:/app/services/sharing/src
      - ../services/shared/src:/app/services/shared/src

  ## ── WS Relay ─────────────────────────────────────────────────────────────────
  ws-relay:
    build:
      context: ..
      dockerfile: services/ws-relay/Dockerfile
    container_name: itinera-ws-relay
    restart: unless-stopped
    profiles: [services]
    environment:
      PORT: ${WS_RELAY_PORT:-3009}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
    ports:
      - "${WS_RELAY_PORT:-3009}:${WS_RELAY_PORT:-3009}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      kong:
        condition: service_healthy
    volumes:
      - ../services/ws-relay/src:/app/services/ws-relay/src
      - ../services/shared/src:/app/services/shared/src

  ## ── Mailhog (dev email) ──────────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: itinera-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

## ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  frontend-node-modules:
  frontend-nuxt-build:
